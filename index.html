<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>対戦記録</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
    .record { background: white; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>対戦記録（リアルタイム）</h1>
  <div id="records"></div>

  <script>
    const url = "https://pokepoke-records-default-rtdb.firebaseio.com/records.json";

    async function loadRecords() {
      const res = await fetch(url);
      const data = await res.json();

      const container = document.getElementById("records");
      container.innerHTML = "";

      for (const key in data) {
        const r = data[key];
        const div = document.createElement("div");
        div.className = "record";
        div.innerHTML = `
          <strong>${r.Date}</strong><br>
          相手: ${r.Opponent}<br>
          結果: ${r.Result}<br>
          編成: ${r.Team}<br>
          コメント: ${r.Comment}
        `;
        container.appendChild(div);
      }
    }

    setInterval(loadRecords, 3000); // 3秒ごとに更新
    loadRecords();
  </script>
</body>
</html>
