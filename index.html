<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>対戦記録</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #333;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 2.2em;
      font-weight: bold;
      color: #0077cc;
    }

    .stats-box, .form-box, .streak-box, .title-box, .chart-box {
      background: #ffffff;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border: 1px solid #e0e0e0;
    }

    .streak-box {
      text-align: center;
      font-size: 1.8em;
      font-weight: bold;
      color: #d32f2f;
    }

    .form-box.editing {
      background: #fff7d1;
      border-left: 5px solid #ffcc00;
    }

    .record {
      background: #fafafa;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
      border-left: 6px solid #0077cc;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      position: relative;
    }

    .record.lose {
      border-left: 6px solid #d32f2f;
    }

    button {
      padding: 12px 18px;
      background: #0077cc;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
    }

    button:hover {
      background: #005fa3;
    }

    .delete-btn, .edit-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      border-radius: 6px;
      padding: 6px 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .edit-btn {
      right: 80px;
      background: #2196F3;
      color: #fff;
    }

    .delete-btn {
      background: #d32f2f;
      color: #fff;
    }

    label { display: block; margin-bottom: 8px; }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 3px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <h1 id="mainTitle">対戦記録（リアルタイム）</h1>

  <div class="title-box">
    <label>タイトルを変更する:</label>
    <input type="text" id="titleInput" placeholder="例：今日の対戦記録">
    <button onclick="changeTitle()">タイトルを変更</button>
  </div>

  <div class="streak-box" id="streakBox">🔥 現在 0 連勝中</div>

  <div class="stats-box">
    <h2>統計</h2>
    <p id="total"></p>
    <p id="wins"></p>
    <p id="losses"></p>
    <p id="rate"></p>
  </div>

  <!-- 📈 勝率グラフ -->
  <div class="chart-box">
    <h2>勝率推移グラフ</h2>
    <canvas id="rateChart"></canvas>
  </div>

  <div class="form-box" id="formBox">
    <h2 id="formTitle">対戦結果を追加する</h2>
    <form id="battleForm">
      <label>日付:
        <input type="text" id="date">
      </label>

      <label>結果:
        <select id="result">
          <option value="勝ち">勝ち</option>
          <option value="負け">負け</option>
        </select>
      </label>

      <label>対戦相手のデッキ:
        <input type="text" id="opponentDeck">
      </label>

      <label>自分のデッキ:
        <input type="text" id="myDeck">
      </label>

      <label>コメント:
        <input type="text" id="comment">
      </label>

      <button type="button" onclick="saveRecord()">送信</button>
    </form>
  </div>

  <div id="records"></div>

  <script>
    const baseUrl = "https://pokepoke-records-default-rtdb.firebaseio.com/records";
    let editKey = null;
    let chart = null;

    function changeTitle() {
      const newTitle = document.getElementById("titleInput").value.trim();
      if (newTitle !== "") {
        document.getElementById("mainTitle").innerText = newTitle;
      }
    }

    window.onload = function() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById("date").value = `${yyyy}/${mm}/${dd}`;
    };

    async function saveRecord() {
      const record = {
        Date: document.getElementById("date").value,
        Result: document.getElementById("result").value,
        OpponentDeck: document.getElementById("opponentDeck").value,
        MyDeck: document.getElementById("myDeck").value,
        Comment: document.getElementById("comment").value
      };

      const url = editKey ? `${baseUrl}/${editKey}.json` : `${baseUrl}.json`;

      await fetch(url, {
        method: editKey ? "PUT" : "POST",
        body: JSON.stringify(record)
      });

      alert(editKey ? "編集を保存しました！" : "送信しました！");

      editKey = null;
      document.getElementById("formTitle").innerText = "対戦結果を追加する";
      document.getElementById("battleForm").reset();
      window.onload();
      document.getElementById("formBox").classList.remove("editing");

      loadRecords();
    }

    function editRecord(key, r) {
      editKey = key;
      document.getElementById("formTitle").innerText = "対戦結果を編集する";

      document.getElementById("date").value = r.Date;
      document.getElementById("result").value = r.Result;
      document.getElementById("opponentDeck").value = r.OpponentDeck;
      document.getElementById("myDeck").value = r.MyDeck;
      document.getElementById("comment").value = r.Comment;

      document.getElementById("formBox").classList.add("editing");
    }

    async function deleteRecord(key) {
      const url = `${baseUrl}/${key}.json`;
      await fetch(url, { method: "DELETE" });
      alert("削除しました！");
      loadRecords();
    }

    async function loadRecords() {
      const res = await fetch(`${baseUrl}.json`);
      const data = await res.json();

      const container = document.getElementById("records");
      container.innerHTML = "";

      if (!data) return;

      const entries = Object.entries(data);
      const sorted = entries.sort((a, b) => new Date(b[1].Date) - new Date(a[1].Date));

      let streak = 0;
      for (const [_, r] of sorted) {
        if (r.Result === "勝ち") streak++;
        else break;
      }
      document.getElementById("streakBox").innerText = `🔥 現在 ${streak} 連勝中`;

      const total = sorted.length;
      const wins = sorted.filter(([_, r]) => r.Result === "勝ち").length;
      const losses = sorted.filter(([_, r]) => r.Result === "負け").length;
      const rate = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;

      document.getElementById("total").innerText = `総試合数：${total}`;
      document.getElementById("wins").innerText = `勝ち：${wins}`;
      document.getElementById("losses").innerText = `負け：${losses}`;
      document.getElementById("rate").innerText = `勝率：${rate}%`;

      /* 📈 勝率推移データ作成 */
      let winCount = 0;
      let rateHistory = [];
      let labels = [];

      sorted.slice().reverse().forEach(([_, r], index) => {
        if (r.Result === "勝ち") winCount++;
        labels.push(index + 1);
        rateHistory.push(((winCount / (index + 1)) * 100).toFixed(1));
      });

      /* グラフ描画 */
      const ctx = document.getElementById("rateChart").getContext("2d");

      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '勝率推移 (%)',
            data: rateHistory,
            borderColor: '#0077cc',
            backgroundColor: 'rgba(0,119,204,0.2)',
            borderWidth: 3,
            tension: 0.3
          }]
        },
        options: {
          scales: {
            y: { beginAtZero: true, max: 100 }
          }
        }
      });

      /* 対戦記録表示 */
      for (const [key, r] of sorted) {
        const div = document.createElement("div");
        div.className = "record";
        if (r.Result === "負け") div.classList.add("lose");

        div.innerHTML = `
          <strong>${r.Date}</strong><br>
          結果: ${r.Result}<br>
          対戦相手のデッキ: ${r.OpponentDeck}<br>
          自分のデッキ: ${r.MyDeck}<br>
          コメント: ${r.Comment}<br>
          <button class="edit-btn" onclick='editRecord("${key}", ${JSON.stringify(r)})'>編集</button>
          <button class="delete-btn" onclick='deleteRecord("${key}")'>削除</button>
        `;
        container.appendChild(div);
      }
    }

    setInterval(loadRecords, 3000);
    loadRecords();
  </script>

</body>
</html>
