<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>対戦記録</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 2.2em;
      font-weight: bold;
      color: #00eaff;
      text-shadow: 0 0 10px #00eaff;
    }

    /* カード風ボックス */
    .stats-box, .form-box, .streak-box {
      background: rgba(30, 30, 30, 0.9);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
      border: 1px solid rgba(0, 255, 255, 0.3);
    }

    /* 連勝カウンター */
    .streak-box {
      text-align: center;
      font-size: 1.8em;
      font-weight: bold;
      color: #ff5252;
      text-shadow: 0 0 10px #ff5252;
    }

    /* 編集モード */
    .form-box.editing {
      background: rgba(255, 200, 0, 0.15);
      border-left: 5px solid #ffcc00;
    }

    /* 対戦記録カード */
    .record {
      background: rgba(40, 40, 40, 0.9);
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
      border-left: 6px solid #00eaff;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.15);
      position: relative;
    }

    .record.lose {
      border-left: 6px solid #ff5252;
    }

    /* ボタン */
    button {
      padding: 12px 18px;
      background: #00eaff;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
      box-shadow: 0 0 10px #00eaff;
    }

    button:hover {
      background: #00bcd4;
    }

    /* 削除・編集ボタン */
    .delete-btn, .edit-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      border-radius: 6px;
      padding: 6px 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .edit-btn {
      right: 80px;
      background: #2196F3;
      color: #fff;
    }

    .delete-btn {
      background: #ff5252;
      color: #fff;
    }

    label { display: block; margin-bottom: 8px; }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 3px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <h1>対戦記録（リアルタイム）</h1>

  <!-- 🔥 連勝カウンター -->
  <div class="streak-box" id="streakBox">🔥 現在 0 連勝中</div>

  <!-- 統計表示 -->
  <div class="stats-box">
    <h2>統計</h2>
    <p id="total"></p>
    <p id="wins"></p>
    <p id="losses"></p>
    <p id="rate"></p>
  </div>

  <!-- 入力フォーム -->
  <div class="form-box" id="formBox">
    <h2 id="formTitle">対戦結果を追加する</h2>
    <form id="battleForm">
      <label>日付:
        <input type="text" id="date">
      </label>

      <label>結果:
        <select id="result">
          <option value="勝ち">勝ち</option>
          <option value="負け">負け</option>
        </select>
      </label>

      <label>対戦相手のデッキ:
        <input type="text" id="opponentDeck">
      </label>

      <label>自分のデッキ:
        <input type="text" id="myDeck">
      </label>

      <label>コメント:
        <input type="text" id="comment">
      </label>

      <button type="button" onclick="saveRecord()">送信</button>
    </form>
  </div>

  <div id="records"></div>

  <script>
    const baseUrl = "https://pokepoke-records-default-rtdb.firebaseio.com/records";
    let editKey = null;

    // ページ読み込み時に今日の日付を自動入力
    window.onload = function() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById("date").value = `${yyyy}/${mm}/${dd}`;
    };

    // 新規 or 編集 保存
    async function saveRecord() {
      const record = {
        Date: document.getElementById("date").value,
        Result: document.getElementById("result").value,
        OpponentDeck: document.getElementById("opponentDeck").value,
        MyDeck: document.getElementById("myDeck").value,
        Comment: document.getElementById("comment").value
      };

      const url = editKey
        ? `${baseUrl}/${editKey}.json`
        : `${baseUrl}.json`;

      await fetch(url, {
        method: editKey ? "PUT" : "POST",
        body: JSON.stringify(record)
      });

      alert(editKey ? "編集を保存しました！" : "送信しました！");

      editKey = null;
      document.getElementById("formTitle").innerText = "対戦結果を追加する";
      document.getElementById("battleForm").reset();
      window.onload();

      document.getElementById("formBox").classList.remove("editing");

      loadRecords(); // 即時反映
    }

    // 編集ボタン
    function editRecord(key, r) {
      editKey = key;
      document.getElementById("formTitle").innerText = "対戦結果を編集する";

      document.getElementById("date").value = r.Date;
      document.getElementById("result").value = r.Result;
      document.getElementById("opponentDeck").value = r.OpponentDeck;
      document.getElementById("myDeck").value = r.MyDeck;
      document.getElementById("comment").value = r.Comment;

      document.getElementById("formBox").classList.add("editing");
    }

    // 削除
    async function deleteRecord(key) {
      const url = `${baseUrl}/${key}.json`;
      await fetch(url, { method: "DELETE" });
      alert("削除しました！");
      loadRecords();
    }

    // Firebaseから読み込み
    async function loadRecords() {
      const res = await fetch(`${baseUrl}.json`);
      const data = await res.json();

      const container = document.getElementById("records");
      container.innerHTML = "";

      if (!data) return;

      const entries = Object.entries(data);
      const sorted = entries.sort((a, b) => new Date(b[1].Date) - new Date(a[1].Date));

      /* 🔥 連勝カウンター計算 */
      let streak = 0;
      for (const [_, r] of sorted) {
        if (r.Result === "勝ち") streak++;
        else break;
      }
      document.getElementById("streakBox").innerText = `🔥 現在 ${streak} 連勝中`;

      /* 統計計算 */
      const total = sorted.length;
      const wins = sorted.filter(([_, r]) => r.Result === "勝ち").length;
      const losses = sorted.filter(([_, r]) => r.Result === "負け").length;
      const rate = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;

      document.getElementById("total").innerText = `総試合数：${total}`;
      document.getElementById("wins").innerText = `勝ち：${wins}`;
      document.getElementById("losses").innerText = `負け：${losses}`;
      document.getElementById("rate").innerText = `勝率：${rate}%`;

      /* 対戦記録表示 */
      for (const [key, r] of sorted) {
        const div = document.createElement("div");
        div.className = "record";
        if (r.Result === "負け") div.classList.add("lose");

        div.innerHTML = `
          <strong>${r.Date}</strong><br>
          結果: ${r.Result}<br>
          対戦相手のデッキ: ${r.OpponentDeck}<br>
          自分のデッキ: ${r.MyDeck}<br>
          コメント: ${r.Comment}<br>
          <button class="edit-btn" onclick='editRecord("${key}", ${JSON.stringify(r)})'>編集</button>
          <button class="delete-btn" onclick='deleteRecord("${key}")'>削除</button>
        `;
        container.appendChild(div);
      }
    }

    setInterval(loadRecords, 3000);
    loadRecords();
  </script>

</body>
</html>
